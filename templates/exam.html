<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>考试模式 - AI 复习问答系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .timer-warning { color: #f43f5e; animation: pulse 1s infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur">
      <div class="mx-auto flex w-full items-center justify-between px-6 py-3">
        <div class="flex items-center gap-2">
          <span class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-indigo-500 text-sm font-bold">AI</span>
          <div>
            <h1 class="text-sm font-semibold text-slate-100">AI 复习问答系统</h1>
            <p class="text-xs text-slate-400">限时模拟考试</p>
          </div>
        </div>
        <nav class="flex items-center gap-3 text-sm">
          <a href="/" class="rounded-md px-3 py-1.5 text-slate-300 hover:bg-slate-800">上传笔记</a>
          <a href="/practice" class="rounded-md px-3 py-1.5 text-slate-300 hover:bg-slate-800">练习</a>
          <a href="/search" class="rounded-md px-3 py-1.5 text-slate-300 hover:bg-slate-800">搜索</a>
          <a href="/exam" class="rounded-md bg-slate-800 px-3 py-1.5 text-indigo-300">考试</a>
          <a href="/wrong" class="rounded-md px-3 py-1.5 text-slate-300 hover:bg-slate-800">错题本</a>
          <a href="/dashboard" class="rounded-md px-3 py-1.5 text-slate-300 hover:bg-slate-800">数据面板</a>
        </nav>
      </div>
    </header>

    <!-- ========== 配置页 ========== -->
    <main id="exam-config" class="mx-auto w-full px-6 py-8 text-sm">
      <section class="mx-auto max-w-2xl rounded-2xl border border-slate-800 bg-slate-900/60 p-6 shadow-xl shadow-slate-900/40">
        <h2 class="mb-1 text-lg font-semibold text-slate-50">📝 模拟考试</h2>
        <p class="mb-6 text-xs text-slate-400">按配置自动组卷，限时答题，自动评分，生成成绩报告。</p>
        <div class="space-y-4">
          <div class="grid gap-4 md:grid-cols-2">
            <div>
              <label class="mb-1 block text-xs font-medium text-slate-300">题目数量</label>
              <input id="exam-count" type="number" min="1" max="50" value="15"
                class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100" />
            </div>
            <div>
              <label class="mb-1 block text-xs font-medium text-slate-300">时间限制（分钟）</label>
              <input id="exam-minutes" type="number" min="1" max="180" value="30"
                class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100" />
            </div>
            <div>
              <label class="mb-1 block text-xs font-medium text-slate-300">题型</label>
              <select id="exam-type" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100">
                <option value="">全部题型</option>
                <option value="single_choice">单选题</option>
                <option value="true_false">判断题</option>
                <option value="short_answer">简答题</option>
              </select>
            </div>
            <div>
              <label class="mb-1 block text-xs font-medium text-slate-300">难度</label>
              <select id="exam-difficulty" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100">
                <option value="">全部难度</option>
                <option value="easy">容易</option>
                <option value="medium">中等</option>
                <option value="hard">困难</option>
              </select>
            </div>
          </div>
          <div>
            <label class="mb-1 block text-xs font-medium text-slate-300">题源模块（可选）</label>
            <select id="exam-module" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100">
              <option value="">全部模块</option>
            </select>
          </div>
          <button id="start-exam" class="w-full rounded-lg bg-indigo-500 py-3 text-sm font-medium text-white hover:bg-indigo-400">
            🚀 开始考试
          </button>
        </div>
      </section>
    </main>

    <!-- ========== 考试界面 ========== -->
    <div id="exam-full" class="hidden fixed inset-0 z-50 flex-col bg-slate-950">
      <header class="flex items-center justify-between border-b border-slate-800 bg-slate-900/90 px-4 py-2 text-sm shrink-0">
        <div class="flex items-center gap-3">
          <span class="text-indigo-400 font-semibold">📝 考试模式</span>
          <span id="exam-progress" class="text-slate-400 text-xs"></span>
        </div>
        <div class="flex items-center gap-4">
          <span id="exam-timer" class="text-lg font-mono font-bold text-slate-100">30:00</span>
          <button id="submit-exam" class="rounded-lg bg-emerald-500 px-4 py-1.5 text-xs text-white hover:bg-emerald-400">交卷</button>
        </div>
      </header>
      <div class="flex flex-1 min-h-0">
        <aside class="w-20 overflow-y-auto border-r border-slate-800 bg-slate-900/60 p-2 shrink-0">
          <div id="question-nav" class="grid grid-cols-3 gap-1"></div>
        </aside>
        <main class="flex-1 overflow-y-auto p-6">
          <div id="exam-questions" class="space-y-6 max-w-3xl mx-auto"></div>
        </main>
      </div>
    </div>

    <!-- ========== 成绩报告 ========== -->
    <div id="exam-report" class="hidden mx-auto w-full px-6 py-8 text-sm">
      <section class="mx-auto max-w-3xl space-y-6">
        <div class="rounded-2xl border border-slate-800 bg-slate-900/60 p-6 shadow-xl text-center">
          <h2 class="text-xl font-bold text-slate-50 mb-2">📊 考试成绩</h2>
          <div class="text-5xl font-bold text-indigo-400 mb-2" id="report-score">0</div>
          <div class="text-slate-400 text-sm" id="report-summary"></div>
        </div>
        <div id="report-tags" class="rounded-2xl border border-slate-800 bg-slate-900/60 p-4 shadow-xl">
          <h3 class="text-sm font-semibold text-slate-100 mb-3">📌 知识点掌握分析</h3>
          <div id="report-tag-list" class="space-y-2"></div>
        </div>
        <div id="report-detail" class="space-y-3"></div>
        <div class="text-center">
          <button onclick="location.reload()" class="rounded-lg bg-indigo-500 px-6 py-2 text-sm text-white hover:bg-indigo-400">返回配置</button>
        </div>
      </section>
    </div>

    <script>
      let examQuestions = [];
      let examAnswers = {};
      let examTimer = null;
      let examTimeLeft = 0;
      let examSubmitted = false;

      function showExam() {
        document.getElementById('exam-config').classList.add('hidden');
        document.getElementById('exam-full').classList.remove('hidden');
        document.getElementById('exam-full').classList.add('flex');
        document.getElementById('exam-report').classList.add('hidden');
      }

      function hideExam() {
        document.getElementById('exam-full').classList.add('hidden');
        document.getElementById('exam-full').classList.remove('flex');
      }

      async function startExam() {
        const count = Math.min(Math.max(parseInt(document.getElementById('exam-count').value) || 15, 1), 50);
        const q_type = document.getElementById('exam-type').value;
        const difficulty = document.getElementById('exam-difficulty').value;
        const note_id = document.getElementById('exam-module').value;

        const params = new URLSearchParams();
        params.set('question_count', String(count));
        if (q_type) params.set('q_type', q_type);
        if (difficulty) params.set('difficulty', difficulty);
        if (note_id) params.set('note_id', note_id);

        try {
          const res = await fetch('/api/exam/start?' + params.toString());
          if (!res.ok) { alert('组卷失败: ' + res.status); return; }
          const data = await res.json();
          examQuestions = data.questions || [];

          if (!examQuestions.length) {
            alert('没有匹配的题目，请调整配置或先在首页上传笔记生成题目');
            return;
          }

          examAnswers = {};
          examSubmitted = false;
          showExam();
          renderExam();
          startTimer();
        } catch (e) {
          alert('组卷失败: ' + e.message);
        }
      }

      function renderExam() {
        const container = document.getElementById('exam-questions');
        const nav = document.getElementById('question-nav');
        container.innerHTML = '';
        nav.innerHTML = '';

        examQuestions.forEach((q, idx) => {
          // 导航按钮
          const navBtn = document.createElement('button');
          navBtn.className = 'w-8 h-8 rounded text-xs font-medium bg-slate-800 text-slate-400 hover:bg-slate-700';
          navBtn.textContent = idx + 1;
          navBtn.dataset.idx = idx;
          navBtn.onclick = () => {
            document.getElementById('q-' + idx)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
          };
          nav.appendChild(navBtn);

          // 题目卡片
          const card = document.createElement('div');
          card.id = 'q-' + idx;
          card.className = 'rounded-xl border border-slate-700 bg-slate-900/60 p-5';

          const typeMap = { single_choice: '单选', true_false: '判断', short_answer: '简答', case_analysis: '案例' };
          const diffMap = { easy: '容易', medium: '中等', hard: '困难' };

          let html = '<div class="flex items-center gap-2 mb-3 flex-wrap">';
          html += '<span class="text-indigo-400 text-xs font-bold">#' + (idx + 1) + '</span>';
          html += '<span class="text-[10px] rounded-full bg-slate-800 px-2 py-0.5 text-slate-300">' + (typeMap[q.q_type] || q.q_type) + '</span>';
          if (q.knowledge_tag) html += '<span class="text-[10px] text-slate-400">' + q.knowledge_tag + '</span>';
          if (q.difficulty) html += '<span class="text-[10px] text-slate-500">' + (diffMap[q.difficulty] || q.difficulty) + '</span>';
          html += '</div>';
          html += '<div class="text-slate-50 text-sm mb-3 leading-relaxed">' + (q.content || '') + '</div>';
          card.innerHTML = html;

          if (q.case_material && q.case_material.trim()) {
            const matDiv = document.createElement('div');
            matDiv.className = 'mb-3 rounded-lg border border-indigo-500/30 bg-indigo-950/40 p-3 text-xs text-slate-300 whitespace-pre-wrap';
            matDiv.innerHTML = '<span class="text-indigo-400 font-medium text-[11px]">📄 案例材料</span><br>' + q.case_material;
            card.appendChild(matDiv);
          }

          const answerArea = document.createElement('div');
          answerArea.className = 'space-y-2';

          if (q.options && q.options.length && q.q_type !== 'case_analysis') {
            q.options.forEach(function(opt) {
              const label = document.createElement('label');
              label.className = 'flex items-center gap-3 rounded-lg border border-slate-700 bg-slate-950 px-3 py-2.5 text-sm text-slate-200 hover:border-indigo-500 cursor-pointer';
              const radio = document.createElement('input');
              radio.type = 'radio';
              radio.name = 'exam-answer-' + q.id;
              radio.value = opt;
              radio.onchange = function() { examAnswers[q.id] = opt; updateNavState(); };
              label.appendChild(radio);
              const span = document.createElement('span');
              span.textContent = opt;
              label.appendChild(span);
              answerArea.appendChild(label);
            });
          } else {
            const ta = document.createElement('textarea');
            ta.rows = 4;
            ta.className = 'w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500';
            ta.placeholder = '请输入你的答案...';
            ta.oninput = function() { examAnswers[q.id] = ta.value; updateNavState(); };
            answerArea.appendChild(ta);
          }

          card.appendChild(answerArea);
          container.appendChild(card);
        });

        document.getElementById('exam-progress').textContent = '已答 0 / ' + examQuestions.length;
      }

      function updateNavState() {
        const btns = document.querySelectorAll('#question-nav button');
        let answeredCount = 0;
        examQuestions.forEach(function(q, idx) {
          const answered = examAnswers[q.id] && examAnswers[q.id].trim();
          if (answered) answeredCount++;
          if (btns[idx]) {
            btns[idx].className = answered
              ? 'w-8 h-8 rounded text-xs font-medium bg-emerald-600 text-white'
              : 'w-8 h-8 rounded text-xs font-medium bg-slate-800 text-slate-400 hover:bg-slate-700';
          }
        });
        document.getElementById('exam-progress').textContent = '已答 ' + answeredCount + ' / ' + examQuestions.length;
      }

      function startTimer() {
        var minutes = parseInt(document.getElementById('exam-minutes').value) || 30;
        examTimeLeft = minutes * 60;
        updateTimerDisplay();
        if (examTimer) clearInterval(examTimer);
        examTimer = setInterval(function() {
          examTimeLeft--;
          updateTimerDisplay();
          if (examTimeLeft <= 0) {
            clearInterval(examTimer);
            alert('⏰ 时间到！自动交卷');
            submitExam();
          }
        }, 1000);
      }

      function updateTimerDisplay() {
        var el = document.getElementById('exam-timer');
        var m = Math.floor(examTimeLeft / 60);
        var s = examTimeLeft % 60;
        el.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
        el.className = examTimeLeft <= 120
          ? 'text-lg font-mono font-bold timer-warning'
          : 'text-lg font-mono font-bold text-slate-100';
      }

      async function submitExam() {
        if (examSubmitted) return;
        examSubmitted = true;
        if (examTimer) clearInterval(examTimer);

        var answers = examQuestions.map(function(q) {
          return { question_id: q.id, user_answer: examAnswers[q.id] || '' };
        });

        try {
          var res = await fetch('/api/exam/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ answers: answers }),
          });
          if (!res.ok) { alert('交卷失败'); return; }
          var data = await res.json();

          hideExam();
          document.getElementById('exam-report').classList.remove('hidden');

          document.getElementById('report-score').textContent = data.score + ' 分';
          document.getElementById('report-summary').textContent = '共 ' + data.total + ' 题，答对 ' + data.correct_count + ' 题';

          var tagList = document.getElementById('report-tag-list');
          tagList.innerHTML = '';
          (data.by_tag || []).forEach(function(t) {
            var pct = Math.round(t.accuracy * 100);
            var color = pct < 40 ? 'bg-rose-500' : pct < 70 ? 'bg-amber-500' : 'bg-emerald-500';
            var row = document.createElement('div');
            row.className = 'flex items-center gap-3';
            row.innerHTML = '<span class="text-xs text-slate-300 w-28 truncate">' + t.name + '</span>'
              + '<div class="flex-1 h-2 rounded-full bg-slate-800 overflow-hidden">'
              + '<div class="h-full ' + color + ' rounded-full" style="width:' + pct + '%"></div></div>'
              + '<span class="text-xs text-slate-400 w-16 text-right">' + t.correct + '/' + t.total + '</span>';
            tagList.appendChild(row);
          });

          var detail = document.getElementById('report-detail');
          detail.innerHTML = '<h3 class="text-sm font-semibold text-slate-100 mb-3">📋 题目详情</h3>';
          (data.results || []).forEach(function(r) {
            var typeMap = { single_choice: '单选', true_false: '判断', short_answer: '简答', case_analysis: '案例' };
            var card = document.createElement('div');
            card.className = 'rounded-xl border p-4 text-sm ' + (r.is_correct ? 'border-emerald-500/40 bg-slate-900/60' : 'border-rose-500/40 bg-slate-900/60');
            var icon = r.is_correct ? '✅' : '❌';
            var html = '<div class="flex items-center gap-2 mb-2 flex-wrap">'
              + '<span>' + icon + '</span>'
              + '<span class="text-[10px] text-indigo-400">#' + r.question_id + '</span>'
              + '<span class="text-[10px] rounded-full bg-slate-800 px-2 py-0.5 text-slate-300">' + (typeMap[r.q_type] || r.q_type) + '</span>'
              + '<span class="text-[10px] text-slate-400">' + (r.knowledge_tag || '') + '</span>'
              + (r.score !== undefined ? '<span class="text-[10px] text-slate-400">' + r.score + '分</span>' : '')
              + '</div>'
              + '<div class="text-slate-50 mb-2">' + (r.content || '') + '</div>'
              + '<div class="text-xs text-slate-400">你的答案：' + (r.user_answer || '未作答') + '</div>'
              + '<div class="text-xs text-emerald-300">标准答案：' + (r.standard_answer || '') + '</div>'
              + (r.analysis ? '<div class="text-xs text-slate-400 mt-1">解析：' + r.analysis + '</div>' : '')
              + (r.comment ? '<div class="text-xs text-amber-300 mt-1">点评：' + r.comment + '</div>' : '');
            card.innerHTML = html;
            detail.appendChild(card);
          });
        } catch (e) {
          alert('交卷失败: ' + e.message);
        }
      }

      document.getElementById('start-exam').addEventListener('click', startExam);
      document.getElementById('submit-exam').addEventListener('click', function() {
        if (confirm('确定要交卷吗？')) submitExam();
      });

      fetch('/api/notes').then(function(r) { return r.json(); }).then(function(d) {
        var sel = document.getElementById('exam-module');
        (d.notes || []).forEach(function(n) {
          var opt = document.createElement('option');
          opt.value = n.id;
          opt.textContent = '[' + n.id + '] ' + (n.title || '未命名');
          sel.appendChild(opt);
        });
      });
    </script>
  </body>
</html>
